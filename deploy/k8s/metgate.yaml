# Manifest K8s minimal pour MetGate.
# Usage :
#   1) Créer le Secret avec les tokens (jamais committé) :
#      kubectl create secret generic metgate-secret \
#        --from-literal=METGATE_TOKEN='xxxxx' \
#        --from-literal=EUMETSAT_CONSUMER_KEY='xxxxx' \
#        --from-literal=EUMETSAT_CONSUMER_SECRET='xxxxx' \
#        --from-literal=OPENSKY_CLIENT_ID='' \
#        --from-literal=OPENSKY_CLIENT_SECRET=''
#      Les clés OPENSKY_* et EUMETSAT_* sont optionnelles : si absentes les
#      endpoints associés renvoient 503 (comportement volontaire).
#   2) (Optionnel) Créer la ConfigMap metgate-config pour le proxy sortant
#      et/ou surcharger les URLs des services extérieurs (miroir interne).
#      Sans elle, accès direct + URLs publiques par défaut. Exemple :
#      kubectl create configmap metgate-config \
#        --from-literal=OUTBOUND_PROXY_URL='http://proxy.corp:3128' \
#        --from-literal=NO_PROXY='.meteo.fr,.svc.cluster.local'
#      Variables reconnues : OUTBOUND_PROXY_URL, NO_PROXY, OUTBOUND_CA_FILE,
#      OUTBOUND_TLS_INSECURE, OPENSKY_BASE_URL, OPENSKY_AUTH_URL,
#      ADSBFI_BASE_URL, EUMETSAT_API_BASE_URL, EUMETVIEW_WMS_URL.
#      NB : OUTBOUND_CA_FILE pointe vers un fichier DANS le conteneur — monter
#      le PEM via un volume (configMap/secret) et donner son mountPath ici.
#   3) Appliquer :
#      kubectl apply -f deploy/k8s/metgate.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metgate
  labels:
    app: metgate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metgate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: metgate
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          # Bumper la version explicitement plutôt que :latest (reproductibilité,
          # rollback simple via kubectl rollout undo).
          image: ghcr.io/benedictemarty/metgate:0.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          # ConfigMap optionnelle : proxy sortant + URLs des services extérieurs
          # (cf. en-tête de ce fichier). Le pod démarre sans elle.
          envFrom:
            - configMapRef:
                name: metgate-config
                optional: true
          env:
            - name: PORT
              value: "8080"
            - name: METGATE_BASE_URL
              value: "https://metgate-mf.meteo.fr"
            - name: METGATE_CACHE_TTL_SECONDS
              value: "60"
            - name: METGATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: metgate-secret
                  key: METGATE_TOKEN
            - name: EUMETSAT_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: metgate-secret
                  key: EUMETSAT_CONSUMER_KEY
                  optional: true
            - name: EUMETSAT_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: metgate-secret
                  key: EUMETSAT_CONSUMER_SECRET
                  optional: true
            - name: OPENSKY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: metgate-secret
                  key: OPENSKY_CLIENT_ID
                  optional: true
            - name: OPENSKY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: metgate-secret
                  key: OPENSKY_CLIENT_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          # Le pré-chargement CTH au démarrage (téléchargement + décodage NetCDF
          # EUMETSAT) est gourmand en CPU : une limite à 500m throttlait le boot
          # et faisait tomber les pods (constaté en cluster). 2 CPU / 4Gi laissent
          # la marge pour les décodages concurrents (vent + tropo + cendres).
          # L'emptyDir /tmp (disque) ne compte pas dans la limite mémoire.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /tmp inscriptible obligatoire : les décodages NetCDF (vent, tropo,
          # cendres, foudre, CTH) écrivent des fichiers temporaires
          # metgate-nc-*.nc. Sans ce volume, rootfs read-only → 503
          # « read-only file system ». Équivalent du tmpfs /tmp du compose.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: metgate
  labels:
    app: metgate
spec:
  type: ClusterIP
  selector:
    app: metgate
  ports:
    - name: http
      port: 80
      targetPort: http
